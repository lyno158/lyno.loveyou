<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>lyno.loveyou</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    background:#000;
    color:#00ff44;
    font-family:monospace;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   شاشة الهكر
========================= */

.box{
    position:relative;
    width:92%;
    max-width:700px;
    padding:30px 20px;
    background:#010501;
    border:1px solid #00ff44;
    box-shadow:
        0 0 35px rgba(0,255,60,.4),
        inset 0 0 25px rgba(0,255,60,.1);
    text-align:center;
    overflow:hidden;
}

#matrix{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    opacity:.28;
}

.code{
    position:absolute;
    top:-120px;
    color:#00ff44;
    font-size:18px;
    line-height:1.2;
    white-space:pre;
    text-shadow:0 0 8px #00ff44;
    animation:fall linear infinite;
}

@keyframes fall{
    0%{
        transform:translateY(-120px);
        opacity:0;
    }

    10%{opacity:1}
    90%{opacity:1}

    100%{
        transform:translateY(110vh);
        opacity:0;
    }
}

.content{
    position:relative;
    z-index:2;
}

h1{
    margin:0 0 20px;
    font-size:clamp(28px,7vw,55px);
    text-shadow:
        0 0 10px #00ff44,
        0 0 25px #00ff44;

    animation:glitch .8s infinite;
}

@keyframes glitch{
    0%,90%,100%{transform:none}
    92%{transform:translateX(3px)}
    94%{transform:translateX(-3px)}
}

.alert{
    font-size:21px;
    margin-bottom:25px;
    animation:blink .5s infinite alternate;
}

@keyframes blink{
    from{opacity:.4}
    to{opacity:1}
}

.row{
    direction:ltr;
    display:flex;
    justify-content:space-between;
    padding:14px 5px;
    border-bottom:1px solid #064d1b;
    font-size:16px;
    background:rgba(0,0,0,.55);
}

.value{
    color:#00ff44;
    text-shadow:0 0 8px #00ff44;
}

#terminal{
    direction:ltr;
    text-align:left;
    height:100px;
    overflow:hidden;
    margin-top:22px;
    font-size:13px;
    text-shadow:0 0 5px #00ff44;
}

.notice{
    margin-top:18px;
    padding:14px;
    border:1px solid #00ff44;
    color:#00ff44;
    font-size:15px;
    line-height:1.8;
    background:rgba(0,0,0,.7);
}

#soundButton{
    margin-top:15px;
    padding:10px 20px;
    background:#001b08;
    color:#00ff44;
    border:1px solid #00ff44;
    font-family:monospace;
    cursor:pointer;
}


/* =========================
   شاشة النهاية
========================= */

#endScreen{
    position:fixed;
    inset:0;
    background:#000;
    color:#00ff44;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:9998;
}

.endContent{
    padding:20px;
}

.endContent h1{
    font-size:65px;
}

.endContent p{
    font-size:28px;
    line-height:1.7;
}


/* =========================
   الجامب سكير
========================= */

#jumpscare{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:99999;
    overflow:hidden;
}


/* =========================
   الأكواد الخضراء
========================= */

#scareMatrix{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:1;
    pointer-events:none;
    opacity:.6;
}

.scareCode{
    position:absolute;
    top:-150px;
    color:#00ff44;
    font-size:18px;
    line-height:1.1;
    text-shadow:0 0 8px #00ff44;
    white-space:pre;
    animation:scareFall linear infinite;
}

@keyframes scareFall{
    0%{
        transform:translateY(-150px);
        opacity:0;
    }

    10%{opacity:1}
    90%{opacity:1}

    100%{
        transform:translateY(120vh);
        opacity:0;
    }
}


/* =========================
   صورة التخويف
========================= */

#jumpscare img{
    position:relative;
    z-index:2;

    display:block;

    width:100vw;
    height:100vh;

    object-fit:cover;
    object-position:center;

    margin:0;
    padding:0;
    border:0;

    animation:scareShake .05s infinite;
}

@keyframes scareShake{
    0%{
        transform:scale(1.05) translate(0,0);
    }

    25%{
        transform:scale(1.08) translate(5px,-4px);
    }

    50%{
        transform:scale(1.05) translate(-5px,4px);
    }

    75%{
        transform:scale(1.08) translate(4px,5px);
    }

    100%{
        transform:scale(1.05) translate(-4px,-5px);
    }
}


/* =========================
   مربع الحسابات
========================= */

.socials{
    position:absolute;

    z-index:10;

    bottom:8%;

    left:50%;

    transform:translateX(-50%);

    width:88%;

    max-width:500px;

    text-align:center;

    color:#00ff44;

    font-size:20px;

    font-weight:bold;

    text-shadow:
        0 0 5px #00ff44,
        0 0 12px #00ff44,
        0 0 22px #00ff44;

    background:rgba(0,0,0,.88);

    border:2px solid #00ff44;

    border-radius:8px;

    padding:14px 10px;
}

.lyno-title{
    font-size:30px;

    margin-bottom:10px;

    color:#00ff44;

    text-shadow:
        0 0 5px #00ff44,
        0 0 15px #00ff44,
        0 0 25px #00ff44;
}

.socials div{
    margin:7px 0;
}

.socials span{
    color:#fff;

    text-shadow:
        0 0 5px #00ff44,
        0 0 12px #00ff44;
}


/* للجوال */

@media(max-width:500px){

    .socials{
        bottom:7%;
        width:90%;
        font-size:17px;
        padding:12px 8px;
    }

    .lyno-title{
        font-size:26px;
    }

    .endContent p{
        font-size:23px;
    }

}
</style>
</head>

<body>


<!-- =========================
     شاشة الهكر
========================= -->

<div class="box" id="hackScreen">

    <div id="matrix"></div>

    <div class="content">

        <h1>
            تم تهكيرك بواسطة لينو
        </h1>

        <div class="alert">
            ⚠ SYSTEM ALERT ⚠
        </div>

        <div class="row">
            <span>EMAIL</span>
            <span class="value">
                **********gmail.com
            </span>
        </div>

        <div class="row">
            <span>PASSWORD</span>
            <span class="value">
                *********
            </span>
        </div>

        <div class="row">
            <span>TIKTOK</span>
            <span class="value">
                ii_go7
            </span>
        </div>

        <div class="row">
            <span>DISCORD</span>
            <span class="value">
                ps4h
            </span>
        </div>

        <div id="terminal"></div>

        <div class="notice">
            ⚠ SYSTEM WARNING ⚠
            <br>
            LYNO&lt;/&gt; DEV
        </div>

        <button id="soundButton">
            🔊 اضغط لتفعيل الصوت
        </button>

    </div>
</div>


<!-- =========================
     شاشة لينو
========================= -->

<div id="endScreen">

    <div class="endContent">

        <h1>LYNO ❤️</h1>

        <p>
            لينو يقول: مقلب 😂
            <br>
            ولا تفتح أي موقع غريب، مواح 🥺❤️
        </p>

    </div>

</div>


<!-- =========================
     الجامب سكير
========================= -->

<div id="jumpscare">

    <div id="scareMatrix"></div>

    <img src="scare.jpg" alt="">

    <div class="socials">

        <div class="lyno-title">
            LYNO
        </div>

        <div>
            تيك توك: <span>ii_go7</span>
        </div>

        <div>
            ديسكورد: <span>ps4h</span>
        </div>

    </div>

</div>


<script>

/* =========================
   رموز الهكر
========================= */

const matrix =
document.getElementById("matrix");

const chars =
"01アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@<>[]{}";

for(let i=0;i<35;i++){

    const column =
    document.createElement("div");

    column.className="code";

    let text="";

    for(
        let j=0;
        j<Math.floor(Math.random()*15)+8;
        j++
    ){

        text += chars[
            Math.floor(
                Math.random()*chars.length
            )
        ];

        text += "<br>";
    }

    column.innerHTML=text;

    column.style.left =
    Math.random()*100+"%";

    column.style.animationDuration =
    (Math.random()*5+3)+"s";

    column.style.animationDelay =
    (-Math.random()*8)+"s";

    matrix.appendChild(column);
}


/* =========================
   رموز الجامب سكير
========================= */

const scareMatrix =
document.getElementById("scareMatrix");

const scareChars =
"01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@<>[]{}";

for(let i=0;i<45;i++){

    const column =
    document.createElement("div");

    column.className="scareCode";

    let text="";

    for(let j=0;j<20;j++){

        text += scareChars[
            Math.floor(
                Math.random()*scareChars.length
            )
        ];

        text += "<br>";
    }

    column.innerHTML=text;

    column.style.left =
    Math.random()*100+"%";

    column.style.animationDuration =
    (Math.random()*3+2)+"s";

    column.style.animationDelay =
    (-Math.random()*5)+"s";

    scareMatrix.appendChild(column);
}


/* =========================
   أوامر الشاشة
========================= */

const messages=[
    "[SYSTEM] Initializing...",
    "[ALERT] Security warning...",
    "[SCAN] Running simulation...",
    "[WARNING] System alert...",
    "[SYSTEM] Connection established...",
    "[LYNO] Simulation active..."
];

let n=0;

function terminal(){

    const screen =
    document.getElementById("terminal");

    screen.innerHTML +=
    messages[n]+"<br>";

    n=(n+1)%messages.length;

    if(screen.children.length>7){
        screen.removeChild(
            screen.firstChild
        );
    }

    setTimeout(
        terminal,
        650
    );
}

terminal();


/* =========================
   الصوت
========================= */

let audioContext=null;
let audioEnabled=false;

function enableAudio(){

    const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

    if(!AudioContext)return;

    if(!audioContext){
        audioContext=new AudioContext();
    }

    if(audioContext.state==="suspended"){
        audioContext.resume();
    }

    audioEnabled=true;

    document.getElementById(
        "soundButton"
    ).textContent="🔊 الصوت مفعل";

    startAlarm();
}


document.getElementById(
    "soundButton"
).addEventListener(
    "click",
    enableAudio
);


/* =========================
   صوت الكيبورد والبرمجة
========================= */

function startAlarm(){

    if(!audioContext)return;

    let count=0;

    function keySound(){

        const now =
        audioContext.currentTime;

        const osc =
        audioContext.createOscillator();

        const gain =
        audioContext.createGain();

        osc.type="square";

        const frequencies=[
            180,
            240,
            320,
            210,
            280,
            390
        ];

        osc.frequency.value =
        frequencies[
            count%frequencies.length
        ];

        gain.gain.setValueAtTime(
            .0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .055,
            now+.005
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+.045
        );

        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );

        osc.start(now);

        osc.stop(now+.05);

        count++;

        if(count<45){

            setTimeout(
                keySound,
                Math.random()*100+35
            );

        }

    }

    keySound();
}


/* =========================
   الانتقال بعد 5 ثواني
========================= */

setTimeout(()=>{

    document.getElementById(
        "hackScreen"
    ).style.display="none";

    document.getElementById(
        "endScreen"
    ).style.display="flex";


    setTimeout(()=>{

        document.getElementById(
            "endScreen"
        ).style.display="none";

        document.getElementById(
            "jumpscare"
        ).style.display="flex";


        if(audioEnabled){
            jumpSound();
        }

    },1800);

},5000);


/* =========================
   صوت الجامب سكير
========================= */

function jumpSound(){

    if(!audioContext)return;

    const now =
    audioContext.currentTime;


    const osc =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();


    osc.type="sawtooth";


    osc.frequency.setValueAtTime(
        180,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        1400,
        now+.12
    );

    osc.frequency.exponentialRampToValueAtTime(
        700,
        now+.55
    );


    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .22,
        now+.02
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.7
    );


    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );


    osc.start(now);

    osc.stop(now+.7);

}

</script>

</body>
